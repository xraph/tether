# Example config for the tether binary. Every key is here with its default, so
# copying this file and deleting what you do not change gives the same server
# as running with no file at all.
#
#   tether --config ./tether.yaml
#
# Without --config, tether reads ./tether.yaml when it exists and uses the
# defaults when it does not. A key you leave out keeps its default.
#
# The admin token does not live here. Set TETHER_ADMIN_TOKEN in the
# environment, or start with --insecure-admin to leave the admin API and the
# dashboard open (for a laptop, not for a server). The PostgreSQL connection
# string can stay out of this file too: see server.database.dsn below.

# Settings that only a standalone process needs.
server:
  # Where the admin API, the device publish endpoint and the dashboard listen.
  http_address: ":8080"

  # The SQLite file for tenants, devices, keys and roles, used when the
  # database driver is sqlite. Its directory is created when it is missing.
  sqlite_path: "./data/tether.db"

  # Where tenants, devices, keys and roles live.
  database:
    # sqlite keeps them in the file above, which suits one node or a cell on
    # one machine. postgres keeps them in a PostgreSQL that every node of the
    # cell reaches, which is what a cell across hosts needs.
    driver: sqlite

    # The PostgreSQL connection string, a postgres:// URL or key=value pairs.
    # Needed with driver: postgres, and an error with driver: sqlite. It holds
    # the password, so prefer the TETHER_DATABASE_DSN environment variable,
    # which wins over this key. Example:
    #   postgres://tether:secret@db.internal:5432/tether?sslmode=require
    dsn: ""

# Tether's own settings. The same keys work under extensions.tether when you
# mount the extension in your own Forge app.
tether:
  # Prefix for every REST route: the admin API lives under
  # <base_path>/v1/tenants and the device endpoint at <base_path>/v1/publish.
  base_path: "/tether"

  # Set to true to mount no REST routes at all. The broker still runs.
  disable_routes: false

  # Name of the grove database to use when the container holds more than one.
  # Empty uses the default database. The binary has only one.
  grove_database: ""

  # Set to true to stop Tether creating or upgrading its tables at startup,
  # when you run its migrations some other way. Keysmith and warden still
  # migrate their own.
  disable_migrate: false

  # Who may do what on Tether's dashboard pages. With false, a signed-in
  # dashboard user sees only the tenant their session names (the org their
  # identity provider puts on the session) and can't create, change or
  # delete tenants. Set it to true and every signed-in user is an operator,
  # with every tenant in reach. --insecure-admin makes everyone an operator.
  dashboard_operators: false

  broker:
    # The plain MQTT listener. Empty turns it off.
    tcp_address: ":1883"

    # MQTT over WebSocket (subprotocol "mqtt", any path). Empty turns it off.
    websocket_address: ""

    # MQTT over TLS. Off by default. To turn it on, uncomment all three keys.
    # tls:
    #   address: ":8883"
    #   cert_file: "/etc/tether/server.crt"
    #   key_file: "/etc/tether/server.key"

    # Where sessions, subscriptions, in-flight messages and retained messages
    # persist (a Badger database). The directory is created when it is
    # missing. Set it to "" to keep all of that in memory only.
    data_dir: "./data/sessions"

    # The longest session expiry a client may ask for. 168h is 7 days.
    max_session_expiry: 168h

    # The largest MQTT packet the broker accepts, in bytes. This is 1 MiB. The
    # HTTP publish endpoint takes the same limit for its payload.
    max_packet_size: 1048576

    # The longest topic name or filter a client may send, in bytes. A longer
    # one is refused with reason code 0x90.
    max_topic_length: 1024

    # How many QoS 1 and 2 messages the broker keeps in flight for one
    # client, the queue of an offline session included. Past it, messages for
    # that client are dropped.
    max_inflight: 1024

  # Lets users and service accounts connect with an authsome JWT as the MQTT
  # password (username = the token's sub), next to device keys. Off while
  # this block is absent. The tokens need an org_id claim, which authsome does
  # not stamp yet, an iss equal to issuer and an aud naming one of audience.
  # Uncomment all of jwks_url, issuer and audience to turn it on. leeway is
  # the clock skew allowed on nbf; it does not stretch exp.
  # jwt:
  #   jwks_url: "https://auth.example.com/.well-known/jwks.json"
  #   issuer: "https://auth.example.com"
  #   audience: ["tether"]
  #   algorithms: [RS256, EdDSA, ES256]
  #   refresh_interval: 10m
  #   leeway: 30s

  # Run this node as one broker of a cell: several nodes sharing sessions,
  # QoS 1 and 2 messages, retained messages and shared subscriptions over
  # NATS JetStream, so a client can connect to any of them. Off while this
  # block is absent. Every node of a cell needs the same cell name and its own
  # node_id (--node-id or TETHER_NODE_ID set it from outside the file).
  #
  # The nodes of a cell share tenants, keys and roles. On SQLite that means
  # the same sqlite_path, so one host. Across hosts, set
  # server.database.driver: postgres and point every node at the same
  # database.
  # cluster:
  #   enabled: true
  #   node_id: "n1"
  #   cell: "demo"                     # lowercase letters and digits, 1 to 16
  #
  #   # embedded runs a NATS server inside each node: for cells of up to
  #   # three nodes. Past that, run NATS yourself and use external.
  #   mode: embedded
  #   embedded:
  #     listen: "127.0.0.1:-1"           # NATS clients; -1 picks a free port
  #     cluster_name: "demo"
  #     cluster_listen: "127.0.0.1:6222" # routes from the other nodes
  #     routes: ["nats://127.0.0.1:6223", "nats://127.0.0.1:6224"]
  #     store_dir: ""                    # empty: ./data/nats/<node_id>
  #     # A listen address past loopback needs user and password (every
  #     # node of the cell gets the same pair), or insecure: true to let
  #     # anyone who reaches the port in.
  #     user: ""
  #     password: ""
  #     insecure: false
  #
  #   # external connects to NATS you run (3 or 5 JetStream servers).
  #   # mode: external
  #   # urls: ["nats://nats-1:4222", "nats://nats-2:4222", "nats://nats-3:4222"]
  #   # credentials: "/etc/tether/nats.creds"
  #
  #   heartbeat: 2s        # how often a node renews its lease
  #   lease: 24s           # fence after lease/2, dead after lease + 2s
  #   replicas: 0          # 0 picks min(3, servers)
  #   log_max_age: 168h    # how long an offline session's messages wait
  #   pull_heartbeat: 2s   # log readers and the control bus: a lost pull costs about twice this
  #   no_discovery: false  # only for a node behind a proxy

# The dashboard has its own section (dashboard:), and its auth is off by
# default. While it is off, Tether's dashboard pages refuse every request
# unless the binary runs with --insecure-admin. Once you turn it on, set
# tether.dashboard_operators to true if your dashboard users run the whole
# node. See the Forge dashboard extension for its keys.

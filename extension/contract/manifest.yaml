schemaVersion: 1
contributor:
  name: tether
  envelope:
    supports: [v1]
    preferred: v1
  capabilities: [tether.read, tether.write]
  app:
    displayName: Tether
    slug: tether
    icon: radio-tower

# Every intent is scoped to the caller's tenant: the tenant the host's
# session names (a tenant_id claim, or the org of the forge Scope its auth
# middleware sets), mapped to a Tether tenant. A tenantId naming another
# tenant is PERMISSION_DENIED, an omitted one is the caller's own, and a
# caller with no tenant is refused. Operators (WithDashboardOperators, or
# WithInsecureDashboard) may name any tenant and manage tenants; for them
# overview.stats without a tenantId is the node total. session.info says
# which of the two the caller is.
#
# Intents that call the broker (overview.stats, clients.*, sessions.*,
# retained.*) answer UNAVAILABLE while the broker is not running.
intents:
  # Reads
  - { name: session.info,      kind: query, version: 1, capability: read }
  - { name: overview.stats,    kind: query, version: 1, capability: read }
  - { name: tenants.list,      kind: query, version: 1, capability: read }
  - { name: tenants.get,       kind: query, version: 1, capability: read }
  - { name: devices.list,      kind: query, version: 1, capability: read }
  - { name: devices.get,       kind: query, version: 1, capability: read }
  - { name: roles.list,        kind: query, version: 1, capability: read }
  - { name: roles.topics.get,  kind: query, version: 1, capability: read }
  - { name: clients.list,      kind: query, version: 1, capability: read }
  - { name: retained.list,     kind: query, version: 1, capability: read }

  # Tenants. A change to a tenant's limits or enabled flag reaches its live
  # connections, so the client list and the counters move with it.
  - { name: tenants.create, kind: command, version: 1, capability: write,
      invalidates: [tenants.list, overview.stats] }
  - { name: tenants.update, kind: command, version: 1, capability: write,
      invalidates: [tenants.list, tenants.get, clients.list, overview.stats] }
  - { name: tenants.delete, kind: command, version: 1, capability: write,
      invalidates: [tenants.list, tenants.get, clients.list, overview.stats] }

  # Devices. provision and rotate answer with the raw key once (the
  # dispatcher never keeps that response for replay). Revoke and delete end
  # the device's live connections through the keysmith plugin events.
  - { name: devices.provision, kind: command, version: 1, capability: write,
      invalidates: [devices.list] }
  - { name: devices.rotate, kind: command, version: 1, capability: write,
      invalidates: [devices.list, devices.get] }
  - { name: devices.revoke, kind: command, version: 1, capability: write,
      invalidates: [devices.list, devices.get, clients.list, overview.stats] }
  - { name: devices.delete, kind: command, version: 1, capability: write,
      invalidates: [devices.list, devices.get, clients.list, overview.stats] }
  - { name: devices.roles.set, kind: command, version: 1, capability: write,
      invalidates: [devices.list, devices.get] }

  # Roles and their topic grants. A role in use by a device cannot be
  # deleted (CONFLICT), nor one that is another role's parent.
  - { name: roles.create, kind: command, version: 1, capability: write,
      invalidates: [roles.list, roles.topics.get] }
  - { name: roles.delete, kind: command, version: 1, capability: write,
      invalidates: [roles.list, roles.topics.get] }
  - { name: roles.topics.set, kind: command, version: 1, capability: write,
      invalidates: [roles.list, roles.topics.get] }

  # Live clients and retained messages.
  - { name: clients.kick, kind: command, version: 1, capability: write,
      invalidates: [clients.list, overview.stats] }
  - { name: sessions.delete, kind: command, version: 1, capability: write,
      invalidates: [clients.list, overview.stats] }
  - { name: retained.delete, kind: command, version: 1, capability: write,
      invalidates: [retained.list, overview.stats] }
